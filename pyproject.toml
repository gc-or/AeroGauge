[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerogauge"
version = "0.1.0"
description = "Reproducible MuJoCo evaluation of the WRJ quadrotor"
requires-python = ">=3.11,<3.13"
dependencies = ["mujoco==3.15.0", "numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.scripts]
aerogauge = "aerogauge.cli:main"

[tool.setuptools.packages.find]
include = ["aerogauge*"]

[tool.setuptools.package-data]
aerogauge = ["data/**/*.json", "data/**/*.xml", "data/**/*.obj", "data/**/*.md"]
